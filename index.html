<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INFORRÓ</title>
  <link rel="icon" href="assets/inforró.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bandeiras-top">
    <img src="assets/bandeirasroxas.png" alt="Bandeirinhas juninas" />
  </div>

  <main class="container">
    <div class="pixels-bg">
      <img src="assets/pixels.png" alt="" class="pixels-img" />
    </div>

    <div class="card">
      <div class="balao">
        <img src="assets/inforró.png" alt="Balão de São João" class="balao-img" />
      </div>

      <div class="logo-wrap">
        <h1 class="logo-text">
          INFOR<span class="logo-o">O</span>
        </h1>
      </div>

      <div class="botoes">
        <a href="lanhouse/lanhouse.html" class="btn btn-lanhouse">
          <div class="btn-content">
            <span class="btn-title">Lan House</span>
            <span class="btn-sub">Jogos, valores e horários</span>
          </div>
          <span class="btn-arrow">→</span>
        </a>

        <a href="Inforró/cardapio/cardapio.html" class="btn btn-cardapio">
          <div class="btn-content">
            <span class="btn-title">Cardápio</span>
            <span class="btn-sub">Comidas, doces e bebidas</span>
          </div>
          <span class="btn-arrow">→</span>
        </a>
      </div>
    </div>
  </main>

  <div class="bandeiras-bottom">
    <img src="assets/bandeirasroxas.png" alt="Bandeirinhas juninas" />
  </div>

  <script src="script.js"></script>
</body>
</html>
