<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inforró - Menu Principal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='telainicial.css') }}">
</head>
<body>

    <div class="container">
        
        <!-- ================= HEADER JUNINO ================= -->
        <header class="header-junino">
            <!-- Varal de bandeirinhas no topo -->
            <img src="{{ url_for('static', filename='assets/bandeirasroxas.png') }}" alt="Bandeiras Roxas" class="img-bandeiras">
            
            <!-- Fundo de quadradinhos (pixels) atrás da logo -->
            <img src="{{ url_for('static', filename='assets/pixels.png') }}" alt="Pixels Roxos de Fundo" class="img-pixel-fundo">

            <!-- Quadradinhos roxos extras de decoração -->
            <div class="header-squares">
                <span class="square square-1"></span>
                <span class="square square-2"></span>
                <span class="square square-3"></span>
                <span class="square square-4"></span>
            </div>
            
            <!-- Balão junino na lateral esquerda -->
            <img src="{{ url_for('static', filename='assets/balao.png') }}" alt="Balão Junino Amarelo" class="img-balao">
            
            <!-- Logotipo central do evento -->
            <img src="{{ url_for('static', filename='assets/inforró.png') }}" alt="Logo Inforró" class="img-logo">
        </header>

        <!-- ================= MENU DE BOTÕES ================= -->
        <nav class="menu-botoes">
            
            <!-- Botão 1: Lan House -->
            <a href="{{ url_for('lanhouse') }}" class="btn btn-lanhouse">
                <div class="btn-texto">
                    <span class="btn-titulo">Lan House</span>
                    <span class="btn-subtitulo">Jogos, valores e horarios</span>
                </div>
                <span class="btn-seta">&rarr;</span>
            </a>

            <!-- Botão 2: Cardápio -->
            <a href="{{ url_for('cardapio') }}" class="btn btn-cardapio">
                <div class="btn-texto">
                    <span class="btn-titulo">Cardápio</span>
                    <span class="btn-subtitulo">Comidas, doces e bebidas</span>
                </div>
                <span class="btn-seta">&rarr;</span>
            </a>

        </nav>

    </div>

</body>
</html>
