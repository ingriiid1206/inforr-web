<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INFORRÔ • LAN House</title>
  <meta name="description" content="Cardápio de jogos e preços da Inforrô LAN House. Bloco 2, Sala 10." />
  <link rel="icon" href="../assets/inforró.png" type="image/png" />
  <link rel="stylesheet" href="{{ url_for('static', filename='/styles/lanhouse.css') }}" />
</head>
<body>

  <main class="main-container">
    <div class="content-wrapper">

      <!-- ========== HEADER ========== -->
      <header class="header">
        <div class="header-game-area">
          <canvas id="header-canvas"></canvas>
          <div class="logo-container" id="logo-container">
            <img src="/static/assets/inforró.png" alt="Inforró" class="logo-img" id="logo-img">
          </div>
        </div>
        <p class="font-pixel subtitle">BLOCO 2 • SALA 10</p>
        <p class="header-label">LAN HOUSE DA BARRACA INFORRÓ</p>
      </header>

      <!-- ========== SEÇÃO VALORES & HORÁRIOS (TABS) ========== -->
      <section class="section tabs-section">
        <div class="tabs-header">
          <h2 class="font-pixel tab-title active" id="tab-valores-btn">VALORES</h2>
          <h2 class="font-pixel tab-title" id="tab-horarios-btn">HORÁRIOS</h2>
        </div>
        
        <div class="tab-content-wrapper">
          <div class="tab-content active" id="content-valores">
            <div class="pricing-bars" id="pricing-bars-container"></div>
          </div>
          
          <div class="tab-content hidden" id="content-horarios">
            <div class="hours-bars">
              <div class="horizontal-bar">
                <div class="bar-inner-centered">
                  <span class="hours-period">Manhã</span>
                  <span class="hours-time">08:00 às 11:30</span>
                </div>
              </div>
              <div class="horizontal-bar">
                <div class="bar-inner-centered">
                  <span class="hours-period">Tarde</span>
                  <span class="hours-time">13:30 às 17:30</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ========== CARROSSEL DE INFORMAÇÕES ========== -->
      <section class="section carousel-section">
        <div class="carousel" id="carousel">
          <div class="carousel-track" id="carousel-track"></div>
          <button class="carousel-btn carousel-prev" id="carousel-prev" aria-label="Anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <button class="carousel-btn carousel-next" id="carousel-next" aria-label="Próximo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
          <div class="carousel-dots" id="carousel-dots"></div>
        </div>
      </section>

      <!-- ========== CATÁLOGO DE JOGOS ========== -->
      <section class="section">
        <h2 class="font-pixel section-title section-title-bordered">CATÁLOGO DE JOGOS</h2>

        <!-- Componentes de Busca e Filtro -->
        <div class="search-filter-container">
          <div class="search-box">
            <input type="text" id="game-search" class="game-search-input" placeholder="Pesquisa por jogo">
          </div>
          <div class="category-filters" id="category-filters">
            <button class="filter-btn active" data-genre="all">Todos</button>
            <button class="filter-btn" data-genre="action">Ação</button>
            <button class="filter-btn" data-genre="coop">Co-op / Multiplayer</button>
            <button class="filter-btn" data-genre="fight">Luta</button>
            <button class="filter-btn" data-genre="horror">Terror</button>
            <button class="filter-btn" data-genre="sports">Futebol</button>
            <button class="filter-btn" data-genre="openworld">Mundo Aberto</button>
            <button class="filter-btn" data-genre="racing">Corrida</button>
          </div>
        </div>

        <div class="games-container" id="games-container">
          <!-- Preenchido dinamicamente via JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- ========== MODAL ========== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="game-modal">
      <div class="modal-body">
        <h3 class="font-pixel modal-title" id="modal-game-title"></h3>
        <p class="modal-description" id="modal-game-description"></p>

        <div class="modal-details">
          <!-- Gênero -->
          <div class="detail-row">
            <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="11" x2="10" y2="11" /><line x1="8" y1="9" x2="8" y2="13" />
              <line x1="15" y1="12" x2="15.01" y2="12" /><line x1="18" y1="10" x2="18.01" y2="10" />
              <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" />
            </svg>
            <div>
              <p class="detail-label">Gênero</p>
              <p class="detail-value" id="modal-game-genre"></p>
            </div>
          </div>

          <!-- Plataforma -->
          <div class="detail-row">
            <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
              <line x1="8" y1="21" x2="16" y2="21" />
              <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
            <div>
              <p class="detail-label">Plataforma</p>
              <p class="detail-value" id="modal-game-platform"></p>
            </div>
          </div>

          <!-- Jogadores -->
          <div class="detail-row">
            <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <div>
              <p class="detail-label">Jogadores</p>
              <p class="detail-value" id="modal-game-players"></p>
            </div>
          </div>

          <!-- Tags -->
          <div class="detail-row" id="modal-tags-row">
            <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            <div>
              <p class="detail-label">Tags</p>
              <p class="detail-value" id="modal-game-tags"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="font-pixel modal-close-btn" id="modal-close-btn">FECHAR [X]</button>
      </div>
    </div>
  </div>

  <script src="/static/script/lanhouse.js"></script>
</body>
</html>
